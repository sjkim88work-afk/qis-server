<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QIS 로그인</title>
<link rel="icon" type="image/png" href="/icons/favicon-32.png">
<style>
:root{--ink:#1d2433;--sub:#667085;--line:#d5dbe5;--pri:#1f5fbf;--bad:#c0392b}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#14213d;font-family:'Malgun Gothic','맑은 고딕','Apple SD Gothic Neo',sans-serif;color:var(--ink)}
.card{background:#fff;border-radius:12px;padding:32px 30px 26px;width:min(360px,calc(100vw - 32px));box-shadow:0 10px 40px rgba(0,0,0,.25)}
h1{margin:0 0 4px;font-size:24px;letter-spacing:.5px}
p.sub{margin:0 0 22px;color:var(--sub);font-size:13px}
label{display:block;font-size:12.5px;color:var(--sub);margin:12px 0 5px}
input{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:7px;font:inherit;font-size:14px}
input:focus{outline:2px solid #bcd3f5;border-color:var(--pri)}
button{width:100%;margin-top:20px;padding:11px;border:0;border-radius:7px;background:var(--pri);color:#fff;font:inherit;font-size:14.5px;font-weight:600;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
.err{color:var(--bad);font-size:13px;min-height:18px;margin-top:12px}
.foot{margin-top:14px;font-size:12px;color:var(--sub);line-height:1.5}
</style>
</head>
<body>
<form class="card" id="f" autocomplete="on">
  <h1>QIS</h1>
  <p class="sub">품질정보시스템 · 사내 전용</p>
  <label for="u">아이디</label>
  <input id="u" name="username" autocomplete="username" required autofocus>
  <label for="p">비밀번호</label>
  <input id="p" name="password" type="password" autocomplete="current-password" required>
  <button id="b" type="submit">로그인</button>
  <div class="err" id="e" role="alert"></div>
  <div class="foot">계정이 없거나 비밀번호를 잊었으면 QIS 관리자에게 요청하세요.</div>
</form>
<script>
document.getElementById('f').addEventListener('submit',async ev=>{
  ev.preventDefault();
  const b=document.getElementById('b'),e=document.getElementById('e');b.disabled=true;e.textContent='';
  try{
    const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json','X-QIS':'1'},credentials:'same-origin',
      body:JSON.stringify({username:document.getElementById('u').value,password:document.getElementById('p').value})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok){e.textContent=j.message||'로그인하지 못했습니다';b.disabled=false;document.getElementById('p').select();return}
    // 다른 창에서 로그인이 만료되어 다시 로그인한 경우: 이 창만 닫으면 됨
    if(window.name==='qisLogin'&&window.opener){document.body.innerHTML='<div class="card"><h1>로그인했습니다</h1><p class="sub">이 창을 닫고 원래 QIS 창으로 돌아가세요. 저장하지 못했던 변경은 자동으로 저장됩니다.</p></div>';return}
    location.href=j.user&&j.user.mustChange?'/account?first=1':'/';
  }catch(err){e.textContent='서버에 연결할 수 없습니다';b.disabled=false}
});
</script>
</body>
</html>
