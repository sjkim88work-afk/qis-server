<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QIS 사용 방식</title>
<link rel="icon" type="image/png" href="/icons/favicon-32.png">
<style>
:root{--ink:#1d2433;--sub:#667085;--line:#d5dbe5;--pri:#1f5fbf;--bad:#c0392b;--bg:#f3f5f9}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#14213d;font-family:'Malgun Gothic','맑은 고딕','Apple SD Gothic Neo',sans-serif;color:var(--ink);display:flex;align-items:center;justify-content:center;padding:24px 16px}
.wrap{background:#fff;border-radius:12px;padding:28px 28px 22px;width:min(720px,100%);box-shadow:0 10px 40px rgba(0,0,0,.25)}
h1{margin:0 0 4px;font-size:22px}
p.sub{margin:0 0 18px;color:var(--sub);font-size:13px;line-height:1.55}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:620px){.opts{grid-template-columns:1fr}}
.opt{border:2px solid var(--line);border-radius:10px;padding:14px 16px;cursor:pointer;background:#fff;text-align:left;font:inherit;color:inherit}
.opt:hover{border-color:#9fb8e0}
.opt.on{border-color:var(--pri);background:#f2f7ff}
.opt b{font-size:15.5px;display:block;margin-bottom:6px}
.opt ul{margin:0;padding-left:18px;color:var(--sub);font-size:12.5px;line-height:1.6}
.cur{font-size:11px;color:#fff;background:var(--pri);border-radius:9px;padding:1px 7px;margin-left:6px;vertical-align:2px}
.form{margin-top:16px;border-top:1px solid var(--line);padding-top:14px;display:none}
.form.on{display:block}
label{display:block;font-size:12.5px;color:var(--sub);margin:10px 0 4px}
input[type=text],input[type=password],input[type=number]{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:7px;font:inherit;font-size:14px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chk{display:flex;gap:8px;align-items:center;font-size:13px;margin-top:10px}
.note{font-size:12.5px;color:var(--sub);line-height:1.55;background:var(--bg);border-radius:7px;padding:9px 11px;margin-top:12px}
.btns{display:flex;gap:8px;margin-top:18px}
button.go{flex:1;padding:11px;border:0;border-radius:7px;background:var(--pri);color:#fff;font:inherit;font-size:14.5px;font-weight:600;cursor:pointer}
button.go:disabled{opacity:.55;cursor:default}
button.cancel{padding:11px 16px;border:1px solid var(--line);border-radius:7px;background:#fff;font:inherit;cursor:pointer}
.err{color:var(--bad);font-size:13px;min-height:18px;margin-top:10px;white-space:pre-line}
.foot{font-size:11.5px;color:var(--sub);margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
  <h1 id="ttl">QIS 사용 방식 고르기</h1>
  <p class="sub" id="lead">이 PC에서 QIS를 어떻게 쓸지 고르세요. 나중에 <b>설정 › 데이터 · 백업</b>에서 바꿀 수 있습니다.</p>
  <div class="opts">
    <button type="button" class="opt" data-m="solo"><b>이 PC 혼자 쓰기<span class="cur" hidden>지금</span></b>
      <ul><li>로그인 없이 바로 열림</li><li>이 PC 안에서만 접속 (다른 PC · 핸드폰 접속 차단)</li><li>개인 업무용</li></ul></button>
    <button type="button" class="opt" data-m="server"><b>사내 서버로 쓰기<span class="cur" hidden>지금</span></b>
      <ul><li>같은 사내망의 PC · 핸드폰에서 접속</li><li>사용자마다 아이디 · 비밀번호로 로그인</li><li>이 PC가 켜져 있고 QIS 창이 열려 있어야 접속됨</li></ul></button>
  </div>

  <div class="form" id="f-solo">
    <label for="nm">내 이름 (기록의 담당자 · 작성자로 표시)</label>
    <input type="text" id="nm" maxlength="40">
  </div>

  <div class="form" id="f-server">
    <div id="useExistingRow" class="chk" hidden><input type="checkbox" id="useEx"><label for="useEx" style="margin:0;color:var(--ink)">지금 있는 관리자 계정으로 로그인 (<span id="exNames"></span>)</label></div>
    <div id="newAdmin">
      <p class="sub" style="margin:8px 0 0">로그인할 <b>관리자 계정</b>을 만듭니다. 이 계정으로 로그인해 팀원 계정을 추가합니다.</p>
      <div class="row"><div><label for="au">관리자 아이디</label><input type="text" id="au" value="admin" autocomplete="off"></div>
        <div><label for="an">이름</label><input type="text" id="an" autocomplete="off"></div></div>
      <div class="row"><div><label for="ap">비밀번호 (8자 이상, 영문+숫자)</label><input type="password" id="ap" autocomplete="new-password"></div>
        <div><label for="ap2">비밀번호 한 번 더</label><input type="password" id="ap2" autocomplete="new-password"></div></div>
    </div>
    <label for="pt">접속 포트</label>
    <input type="number" id="pt" min="1024" max="65535" style="max-width:160px">
    <div class="note">켜면 접속 주소(예: <code>http://이PC이름:8080</code>)를 <b>설정 › 데이터 · 백업</b>에 보여 줍니다.
      <span id="winNote">Windows가 <b>방화벽 허용</b>을 물으면 ‘개인 네트워크’를 허용하세요.</span></div>
  </div>

  <div class="err" id="e" role="alert"></div>
  <div class="btns"><button type="button" class="cancel" id="cancel" hidden>취소</button><button type="button" class="go" id="go" disabled>시작하기</button></div>
  <div class="foot" id="foot"></div>
</div>
<script>
const I=JSON.parse(document.getElementById('qisSetup').textContent);
const $=id=>document.getElementById(id);let mode='';
if(I.mode){$('ttl').textContent='QIS 사용 방식 바꾸기';$('lead').innerHTML='지금: <b>'+(I.mode==='solo'?'이 PC 혼자 쓰기':'사내 서버로 쓰기')+'</b>. 바꾸면 QIS가 잠깐 다시 시작됩니다. 데이터는 그대로입니다.';$('cancel').hidden=false;
  document.querySelector(`.opt[data-m="${I.mode}"] .cur`).hidden=false}
$('nm').value=I.localName||I.osUser||'';$('pt').value=I.port||8080;
if(I.admins&&I.admins.length){$('useExistingRow').hidden=false;$('useEx').checked=true;$('exNames').textContent=I.admins.map(a=>a.name+' · '+a.username).join(', ');$('newAdmin').hidden=true}
$('useEx').onchange=()=>{$('newAdmin').hidden=$('useEx').checked};
$('foot').textContent='QIS '+I.version+' · 데이터 폴더: '+I.dataDir;
if(!/Win/i.test(navigator.platform||navigator.userAgent))$('winNote').hidden=true;
document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{mode=b.dataset.m;document.querySelectorAll('.opt').forEach(x=>x.classList.toggle('on',x===b));
  $('f-solo').classList.toggle('on',mode==='solo');$('f-server').classList.toggle('on',mode==='server');$('go').disabled=false;$('e').textContent='';
  $('go').textContent=I.mode?(mode===I.mode?'저장':'바꾸기'):'시작하기'});
$('cancel').onclick=()=>{location.href='/'};
$('go').onclick=async()=>{
  const body={mode};
  if(mode==='solo')body.name=$('nm').value.trim();
  else{body.port=$('pt').value;if(!(I.admins&&I.admins.length&&$('useEx').checked))body.admin={username:$('au').value.trim(),name:$('an').value.trim(),password:$('ap').value,password2:$('ap2').value}}
  $('go').disabled=true;$('e').textContent='';
  try{
    const r=await fetch('/api/desktop/setup',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-QIS':'1'},body:JSON.stringify(body)});
    const j=await r.json().catch(()=>({}));
    if(!r.ok){$('e').textContent=j.message||('오류 '+r.status);$('go').disabled=false;return}
    if(j.restart){document.querySelector('.wrap').innerHTML='<h1>다시 시작하는 중…</h1><p class="sub">잠시 뒤 QIS가 새 방식으로 열립니다.'+(mode==='server'?' 방금 정한 관리자 계정으로 로그인하세요.':'')+'</p>';return}
    location.href=j.next||'/';
  }catch(err){$('e').textContent='QIS에 연결할 수 없습니다';$('go').disabled=false}
};
</script>
</body>
</html>
