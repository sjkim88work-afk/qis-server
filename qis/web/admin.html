<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QIS 관리</title>
<link rel="icon" type="image/png" href="/icons/favicon-32.png">
<style>
:root{--bg:#f4f6f9;--card:#fff;--ink:#1d2433;--sub:#667085;--line:#e3e7ee;--pri:#007A78;--pri2:#e8f0fc;--ok:#1a8f5a;--okb:#e6f5ee;--warn:#b7791f;--warnb:#fdf3e1;--bad:#c0392b;--badb:#fbeaea}
*{box-sizing:border-box}
body{margin:0;font-family:'Malgun Gothic','맑은 고딕','Apple SD Gothic Neo',sans-serif;background:var(--bg);color:var(--ink);font-size:13px}
header{display:flex;align-items:center;gap:12px;padding:10px 18px;background:#0B4F4D;color:#fff}
header h1{margin:0;font-size:17px}
header .sp{flex:1}
header a{color:#cfe0ff;font-size:12.5px;text-decoration:none}
nav{display:flex;gap:2px;padding:0 18px;background:#fff;border-bottom:1px solid var(--line)}
nav button{border:0;background:none;padding:11px 14px;font:inherit;font-size:13.5px;color:var(--sub);cursor:pointer;border-bottom:2px solid transparent}
nav button.on{color:var(--pri);border-bottom-color:var(--pri);font-weight:600}
main{padding:18px;max-width:1280px;margin:0 auto}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
.card h2{margin:0 0 4px;font-size:15px}
.help{color:var(--sub);font-size:12.5px;margin:0 0 12px;line-height:1.55}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--sub);font-weight:600;background:#fafbfc;position:sticky;top:0}
td.nw,th.nw{white-space:nowrap}
.b{border:1px solid #d5dbe5;background:#fff;border-radius:6px;padding:6px 11px;font:inherit;font-size:12.5px;cursor:pointer}
.b.p{background:var(--pri);border-color:var(--pri);color:#fff}
.b.d{color:var(--bad);border-color:#e5b4ad}
.b:disabled{opacity:.5;cursor:default}
input,select{border:1px solid #d5dbe5;border-radius:6px;padding:6px 8px;font:inherit;font-size:12.5px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bg{display:inline-block;padding:1px 7px;border-radius:9px;font-size:11.5px;background:#eef1f5;color:var(--sub)}
.bg.ok{background:var(--okb);color:var(--ok)}.bg.warn{background:var(--warnb);color:var(--warn)}.bg.bad{background:var(--badb);color:var(--bad)}.bg.inf{background:var(--pri2);color:var(--pri)}
.muted{color:var(--sub)}
.chg{font-size:12px;line-height:1.6}
.chg b{font-weight:600}
.chg .old{color:var(--bad);text-decoration:line-through;text-decoration-color:#e8a7a0}
.chg .new{color:var(--ok)}
.lk{color:var(--pri);cursor:pointer}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#1d2433;color:#fff;padding:9px 16px;border-radius:8px;opacity:0;transition:opacity .3s;pointer-events:none;font-size:13px}
#toast.on{opacity:1}
.kv{display:grid;grid-template-columns:140px 1fr;gap:6px 12px;font-size:13px}
.kv div:nth-child(odd){color:var(--sub)}
.scroll{max-height:calc(100vh - 290px);overflow:auto}
/* 2026-11 디자인 리뉴얼 */
:root{--bg:#F4F6F9;--ink:#1D2433;--sub:#5B6577;--line:#E3E7EE;--pri:#007A78;--pri2:#E3F3F2;--ok:#157A4B;--okb:#E3F4EA;--warn:#9A5B00;--warnb:#FDF1DC;--bad:#B9321F;--badb:#FBE7E4}
body{font-family:"IBM Plex Sans KR","Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",sans-serif;font-size:13.5px}
header{background:#0B4F4D;padding:14px 28px}header a{color:#D2E8E6}
nav button.on{color:var(--pri);border-bottom-color:var(--pri)}
main{padding:22px 28px}
.card{border-radius:12px;padding:18px 20px}
.b{border-radius:8px;padding:8px 14px;font-size:13.5px;border-color:#D5DBE5}.b.p{background:var(--pri);border-color:var(--pri)}
input,select{border-radius:8px;padding:8px 10px;font-size:13.5px;border-color:#D5DBE5}
th{background:#F8FAFC;color:#3D4659;font-size:12px}
td{padding:10px 8px}
.bg{border-radius:11px;font-weight:600}
/* 현장 도구 모양 (2026-11): 각진 모서리 · 배지는 한 줄 */
.card{border-radius:3px}.b{border-radius:3px}input,select,textarea{border-radius:3px}.bg{border-radius:3px;white-space:nowrap}
td .b{white-space:nowrap}
/* 좁은 화면 (휴대폰): 옆으로 넘치지 않게 — 탭은 한 줄에서 옆으로 밀기, 표는 카드 안에서 옆으로 밀기, 입력 칸은 화면 폭까지만 */
@media(max-width:760px){
  header{padding:10px 12px;flex-wrap:wrap;gap:4px 12px}
  nav{padding:0 6px;overflow-x:auto;-webkit-overflow-scrolling:touch}
  nav button{white-space:nowrap;flex:none;padding:11px 10px}
  main{padding:12px}
  .card{padding:14px 12px;overflow-x:auto}
  .row>*{max-width:100%}
  .row input,.row select{flex:1 1 140px;min-width:0;width:auto!important}
  select{max-width:100%;text-overflow:ellipsis}
  th{position:static;white-space:nowrap}
  .kv{grid-template-columns:1fr}
  .kv input,.kv select,.kv textarea{width:100%!important;max-width:100%}
  .scroll{max-height:none}
}
</style>
</head>
<body>
<header><h1>QIS 관리</h1><span class="sp"></span><span id="me"></span><a href="/">QIS로 돌아가기</a></header>
<nav id="nav"></nav>
<main id="view"></main>
<div id="toast"></div>
<input type="file" id="impFile" accept=".json,application/json" style="display:none">
<input type="file" id="phJson" accept=".json,application/json" style="display:none">
<input type="file" id="phDir" webkitdirectory multiple style="display:none">
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// 클릭 코드(onclick) 안의 글자: JS 문자열로 만든 뒤 HTML 이스케이프 — esc() 만 쓰면 브라우저가 &#39; 를 ' 로 되돌려 코드가 끼어들 수 있음
const jsq=s=>esc(JSON.stringify(String(s??'')));
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),3200)};
async function api(path,opt={}){
  const r=await fetch(path,{credentials:'same-origin',...opt,headers:{...(opt.body?{'Content-Type':'application/json'}:{}),'X-QIS':'1',...(opt.headers||{})}});
  if(r.status===401){location.href='/login';throw new Error('로그인 필요')}
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw Object.assign(new Error(j.message||('오류 '+r.status)),{code:j.error,status:r.status});
  return j;
}
const post=(p,b,m='POST')=>api(p,{method:m,body:JSON.stringify(b||{})});
const fmt=t=>{if(!t)return '';const d=new Date(t);if(isNaN(d))return t;const p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`};
const TABS=[['users','사용자'],['audit','변경 이력'],['backup','백업 · 데이터'],['telegram','알림 (텔레그램 · 팀즈)'],['update','버전 · 업데이트']];
const ROLES={viewer:'조회',editor:'작성',admin:'관리자'};
const ROLE_HELP={viewer:'보기 · 검색 · 출력만',editor:'등록 · 수정 (기준정보 삭제 · BOM 교체 · 설정 제외)',admin:'모든 기능 + 사용자 · 이력 · 백업 관리'};
const ACT={create:'등록',update:'수정',delete:'삭제',restore:'복원','file.add':'첨부 추가','file.delete':'첨부 삭제',login:'로그인','login.fail':'로그인 실패',logout:'로그아웃',
  'user.create':'사용자 추가','user.update':'사용자 변경','user.reset_password':'비밀번호 초기화','user.change_password':'비밀번호 변경',backup:'백업',export:'내보내기',import:'가져오기',telegram:'텔레그램 요약 전송','telegram.update':'알림 설정 변경'};
const COLL={defects:'불량',ncrs:'NCR',suppliers:'협력사',parts:'부품',receipts:'입고',reviews:'월간 검토',issues:'이슈',cases:'RCA',actions:'RCA 조치',doc:'설정·BOM',files:'첨부',users:'사용자',photos:'사진·첨부',photos_meta_only:'사진 정보만(내용 없음)'};
let tab=location.hash.slice(1)||'users',me=null;
const A={items:[],more:false,f:{coll:'',user:'',action:'',q:'',from:'',to:'',id:''}};

function nav(){$('#nav').innerHTML=TABS.map(([k,l])=>`<button class="${tab===k?'on':''}" onclick="go('${k}')">${l}</button>`).join('')}
function go(t){tab=t;history.replaceState(null,'','#'+t);nav();render()}
async function render(){
  const v=$('#view');
  try{
    if(tab==='users')v.innerHTML=await renderUsers();
    else if(tab==='audit')v.innerHTML=await renderAudit();
    else if(tab==='telegram')v.innerHTML=await renderTelegram();
    else if(tab==='update')v.innerHTML=await renderUpdate();
    else{v.innerHTML=await renderBackup();phMissLoad()}
  }catch(e){v.innerHTML=`<div class="card"><b>불러오지 못했습니다</b> — ${esc(e.message)}</div>`}
}

/* ---- 사용자 ---- */
async function renderUsers(){
  const {users}=await api('/api/admin/users');
  const row=u=>`<tr>
    <td class="nw"><b>${esc(u.name)}</b><div class="muted">${esc(u.username)}</div></td>
    <td><select onchange="setUser(${u.id},{role:this.value})" ${u.id===me.id?'title="본인 역할은 다른 관리자가 바꿉니다"':''}>${Object.entries(ROLES).map(([k,l])=>`<option value="${k}" ${u.role===k?'selected':''}>${l}</option>`).join('')}</select></td>
    <td>${u.active?'<span class="bg ok">사용</span>':'<span class="bg bad">중지</span>'}${u.mustChange?' <span class="bg warn">비밀번호 변경 대기</span>':''}</td>
    <td class="nw muted">${fmt(u.lastLogin)||'-'}</td>
    <td class="nw"><button class="b" onclick="resetPw(${u.id},${jsq(u.name)})">비밀번호 초기화</button>
      ${u.id===me.id?'':u.active?`<button class="b d" onclick="setUser(${u.id},{active:false})">사용 중지</button>`:`<button class="b" onclick="setUser(${u.id},{active:true})">다시 사용</button>`}
      <span class="lk" style="margin-left:6px" onclick="A.f={coll:'',user:${jsq(u.username)},action:'',q:'',from:'',to:'',id:''};go('audit')">이력</span></td></tr>`;
  return `<div class="card"><h2>사용자 추가</h2><p class="help">처음 로그인하면 본인 비밀번호로 바꾸게 됩니다. 임시 비밀번호는 직접 전달하세요 (8자 이상, 영문+숫자).</p>
    <div class="row"><input id="nu" placeholder="아이디 (예: sjkim)" style="width:150px"><input id="nn" placeholder="이름" style="width:120px">
    <select id="nr">${Object.entries(ROLES).map(([k,l])=>`<option value="${k}" ${k==='editor'?'selected':''}>${l} — ${ROLE_HELP[k]}</option>`).join('')}</select>
    <input id="np" placeholder="임시 비밀번호" style="width:150px"><button class="b" onclick="$('#np').value=genPw()">자동 생성</button><button class="b p" onclick="addUser()">추가</button></div></div>
    <div class="card"><h2>사용자 ${users.length}명</h2><p class="help">역할: ${Object.entries(ROLES).map(([k,l])=>`<b>${l}</b> ${ROLE_HELP[k]}`).join(' · ')}. 역할을 바꾸거나 사용 중지하면 그 사용자는 다시 로그인해야 합니다.</p>
    <table><thead><tr><th>이름 · 아이디</th><th>역할</th><th>상태</th><th>마지막 로그인</th><th></th></tr></thead><tbody>${users.map(row).join('')}</tbody></table></div>`;
}
function genPw(){const a='abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ',d='23456789';const r=n=>{const x=new Uint32Array(1);crypto.getRandomValues(x);return x[0]%n};let s='';for(let i=0;i<7;i++)s+=a[r(a.length)];s+=d[r(d.length)]+d[r(d.length)]+d[r(d.length)];return s}
async function addUser(){
  try{const {user}=await post('/api/admin/users',{username:$('#nu').value,name:$('#nn').value,role:$('#nr').value,password:$('#np').value});
    toast(`${user.name} (${user.username}) 추가 — 임시 비밀번호를 전달하세요`);render()}catch(e){toast(e.message)}
}
async function setUser(id,ch){try{await post('/api/admin/users/'+id,ch,'PATCH');toast('변경했습니다');render()}catch(e){toast(e.message);render()}}
async function resetPw(id,name){
  const pw=prompt(`${name}의 새 임시 비밀번호 (8자 이상, 영문+숫자)\n다음 로그인 때 본인이 바꾸게 됩니다.`,genPw());if(!pw)return;
  try{await post(`/api/admin/users/${id}/reset`,{password:pw});toast('초기화했습니다 — 임시 비밀번호를 전달하세요')}catch(e){toast(e.message)}
}

/* ---- 변경 이력 ---- */
const val=v=>v==null||v===''?'<span class="muted">(없음)</span>':typeof v==='object'?esc(JSON.stringify(v)):esc(v);
function changes(it){
  const d=it.detail;if(!d)return '';
  if(d.changes){const ks=Object.keys(d.changes);
    if(it.action==='create'||it.action==='restore')return `<span class="muted">${ks.length}개 항목</span>`;
    if(it.action==='delete')return `<span class="muted">삭제 전 내용은 이전 버전에 보관</span>`;
    return `<div class="chg">${ks.slice(0,12).map(k=>{const [a,b]=d.changes[k];return `<div><b>${esc(k)}</b>: <span class="old">${val(a)}</span> → <span class="new">${val(b)}</span></div>`}).join('')}${ks.length>12?`<div class="muted">외 ${ks.length-12}개</div>`:''}</div>`+
      (d.conflicts&&d.conflicts.length?`<div><span class="bg warn">동시 수정</span> <span class="muted">${esc(d.conflicts.join(', '))} — 다른 사용자가 먼저 고친 값을 덮어씀</span></div>`:d.merged?'<div><span class="bg inf">자동 합침</span></div>':'');
  }
  if(it.action==='login.fail')return d.locked?'<span class="bg bad">계정 잠김</span>':'';
  if(it.action==='user.update')return Object.entries(d).map(([k,[a,b]])=>`${esc(k)}: ${esc(a)} → ${esc(b)}`).join(' · ');
  if(it.action==='backup')return `<span class="muted">${esc(d.db||'')} · 첨부 ${d.files_copied??0}개 복사</span>`;
  return `<span class="muted">${esc(JSON.stringify(d)).slice(0,200)}</span>`;
}
async function renderAudit(more){
  const f=A.f,qs=new URLSearchParams();Object.entries(f).forEach(([k,v])=>{if(v)qs.set(k,v)});
  if(more&&A.items.length)qs.set('before',A.items[A.items.length-1].id);qs.set('limit','200');
  const {items}=await api('/api/admin/audit?'+qs);
  A.items=more?[...A.items,...items]:items;A.more=items.length===200;
  const opt=(o,cur)=>Object.entries(o).map(([k,l])=>`<option value="${k}" ${cur===k?'selected':''}>${l}</option>`).join('');
  return `<div class="card"><h2>변경 이력</h2><p class="help">모든 등록 · 수정 · 삭제 · 로그인이 기록됩니다. 이력은 누구도 고치거나 지울 수 없습니다. 고치기 전 내용은 기록마다 이전 버전으로 보관됩니다.</p>
    <div class="row">
      <input type="date" value="${esc(f.from)}" onchange="A.f.from=this.value"> ~ <input type="date" value="${esc(f.to)}" onchange="A.f.to=this.value">
      <select onchange="A.f.coll=this.value"><option value="">모든 종류</option>${opt(COLL,f.coll)}</select>
      <select onchange="A.f.action=this.value"><option value="">모든 동작</option>${opt(ACT,f.action)}</select>
      <input placeholder="사용자 아이디" value="${esc(f.user)}" onchange="A.f.user=this.value" style="width:120px">
      <input placeholder="검색 (NCR 번호 · 부품 · 내용)" value="${esc(f.q)}" onchange="A.f.q=this.value" style="width:220px">
      ${f.id?`<span class="bg inf">기록 1건만 <span class="lk" onclick="A.f.id='';render()">✕</span></span>`:''}
      <button class="b p" onclick="render()">조회</button><button class="b" onclick="A.f={coll:'',user:'',action:'',q:'',from:'',to:'',id:''};render()">초기화</button>
      <button class="b" onclick="auditCsv()">CSV</button></div></div>
    <div class="card"><div class="scroll"><table><thead><tr><th class="nw">시각</th><th class="nw">사용자</th><th class="nw">동작</th><th class="nw">종류</th><th>대상</th><th>변경 내용</th></tr></thead><tbody>
    ${A.items.map(it=>`<tr><td class="nw muted">${fmt(it.ts)}</td><td class="nw">${esc(it.name||it.username||'')}</td>
      <td class="nw"><span class="bg ${it.action==='delete'||it.action==='file.delete'||it.action==='login.fail'?'bad':it.action==='create'?'ok':''}">${esc(ACT[it.action]||it.action)}</span></td>
      <td class="nw">${esc(COLL[it.coll]||it.coll||'')}</td>
      <td>${it.rec_id&&it.coll&&it.coll!=='files'&&it.coll!=='users'?`<span class="lk" onclick="A.f={coll:${jsq(it.coll)},id:${jsq(it.rec_id)},user:'',action:'',q:'',from:'',to:''};render()">${esc(it.label||it.rec_id)}</span>`:esc(it.label||'')}</td>
      <td>${changes(it)}</td></tr>`).join('')||'<tr><td colspan="6" class="muted">이력이 없습니다</td></tr>'}
    </tbody></table></div>${A.more?`<div style="text-align:center;margin-top:10px"><button class="b" onclick="moreAudit()">더 보기</button></div>`:''}</div>`;
}
async function moreAudit(){$('#view').innerHTML=await renderAudit(true)}
function auditCsv(){
  const q=s=>'"'+String(s??'').replace(/"/g,'""')+'"';
  const rows=[['시각','사용자','아이디','동작','종류','대상','변경 내용','IP'],...A.items.map(it=>[fmt(it.ts),it.name,it.username,ACT[it.action]||it.action,COLL[it.coll]||it.coll,it.label,
    it.detail&&it.detail.changes&&it.action==='update'?Object.entries(it.detail.changes).map(([k,[a,b]])=>`${k}: ${typeof a==='object'?JSON.stringify(a):a??''} → ${typeof b==='object'?JSON.stringify(b):b??''}`).join(' / '):it.detail?JSON.stringify(it.detail):'',it.ip])];
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+rows.map(r=>r.map(q).join(',')).join('\r\n')],{type:'text/csv'}));
  a.download=`QIS_변경이력_${new Date().toISOString().slice(0,10)}.csv`;a.click();
}

/* ---- 백업 · 데이터 ---- */
async function renderBackup(){
  const b=await api('/api/admin/backup');const l=b.last;
  return `<div class="card"><h2>서버 자동 백업</h2><p class="help">매일 ${b.hour}시 이후 한 번, DB 전체 사본 · 기록 JSON · 첨부 사본을 백업 폴더에 저장합니다. 날짜별 DB 사본은 ${b.keep}개까지 보관합니다. 백업 폴더를 다른 PC나 네트워크 드라이브로 지정하면 서버 PC 고장에도 복원할 수 있습니다 (data/qis.json 의 backup_dir).</p>
    <div class="kv"><div>백업 폴더</div><div><code>${esc(b.dir)}</code></div>

async function phPutAll(recs,msg){
  // 한 요청에 8MB 정도씩 나눠 올림
  let n=0,batch=[],size=0;
  const flush=async()=>{if(!batch.length)return;msg.textContent=`올리는 중… ${n+batch.length}/${recs.length}`;const r=await post('/api/files/put',{files:batch});n+=r.saved;batch=[];size=0};
  for(const r of recs){const sz=r.data.length;if(batch.length&&size+sz>8*1048576)await flush();batch.push(r);size+=sz}
  await flush();return n;
}

    }
    const byName=new Map(fs.map(f=>[f.name,f]));
    const recs=[],notFound=[];
    for(const m of miss){
      const info=meta.get(m.id)||{};const cand=[m.file,info.file,m.id+'.jpg',m.id+'.png',m.id+'.pdf'].filter(Boolean);
      const f=cand.map(n=>byName.get(n)).find(Boolean);
      if(!f){notFound.push(m.file||info.file||m.id);continue}
      const ext=(f.name.split('.').pop()||'').toLowerCase(),mime=f.type||MIME[ext]||'application/octet-stream';
      if(f.size>25*1048576){notFound.push(f.name+' (25MB 초과)');continue}
      const data=await fileToURL(f);
      recs.push({id:m.id,name:info.name||m.name||f.name,mime,size:f.size,kind:info.kind||m.kind||(mime.startsWith('image/')?'photo':'doc'),caption:info.caption||'',createdAt:info.createdAt||new Date(f.lastModified).toISOString(),file:f.name,data});
    }
    if(!recs.length){msg.textContent='';toast(`맞는 파일을 찾지 못했습니다 — 찾는 이름 예: ${notFound.slice(0,3).join(', ')}`);return}
    if(!confirm(`빠진 ${miss.length}개 중 ${recs.length}개의 파일을 폴더에서 찾았습니다.${notFound.length?`\n못 찾음 ${notFound.length}개: ${notFound.slice(0,3).join(', ')}${notFound.length>3?' …':''}`:''}\n\n서버에 채울까요?`)){msg.textContent='';return}
    const n=await phPutAll(recs,msg);msg.textContent='';toast(`사진 ${n}개를 채웠습니다${notFound.length?` · 못 찾음 ${notFound.length}개`:''}`);await phMissLoad();
  }catch(err){msg.textContent='';toast('채우기 실패: '+err.message)}
});
$('#impFile').addEventListener('change',async e=>{
  const f=e.target.files[0];if(!f)return;const m=$('#impMsg');m.textContent='읽는 중…';
  try{const data=JSON.parse(await f.text());
    if(!confirm(`${f.name}\n불량 ${(data.defects||[]).length}건 · NCR ${(data.ncrs||[]).length}건 · 협력사 ${(data.suppliers||[]).length}곳${Array.isArray(data.photos)?` · 사진/첨부 ${data.photos.length}개`:''}\n\n서버로 가져올까요?`)){m.textContent='';return}
    m.textContent='가져오는 중… (사진이 많으면 몇 분 걸립니다)';
    let imported;
    try{({imported}=await post('/api/admin/import',data))}
    catch(err){
      if(err.code!=='has_records')throw err;
      if(!confirm('서버에 이미 기록이 있습니다.\n\n지금 기록 · 첨부를 모두 비우고 이 백업으로 바꿀까요?\n(비우기 전 DB 백업을 자동으로 받습니다 · 사용자 계정 · 변경 이력은 유지)')){m.textContent='';return}
      m.textContent='비우고 가져오는 중…';
      ({imported}=await post('/api/admin/import',{...data,_replace:true}));
    }
    m.textContent='';toast('가져왔습니다 — '+Object.entries(imported).map(([k,v])=>`${COLL[k]||k} ${v}`).join(' · '));
    if(imported.photos_meta_only)setTimeout(()=>alert(`사진 ${imported.photos_meta_only}개는 정보만 있고 내용이 없습니다.\n아래 '빠진 사진 채우기'에서 사진 포함 백업(QMS_백업_날짜_시각.json)이나 사진·첨부 폴더로 채우세요.`),300);
    render();
  }catch(err){m.textContent='';toast('가져오기 실패: '+err.message)}
  e.target.value='';
});

api('/api/me').then(j=>{me=j.user;if(me.role!=='admin'){location.href='/';return}$('#me').textContent=`${me.name} (${me.username})`;nav();render()});
</script>
