# 데스크톱 프로그램 빌드 — 맥(QIS.app, Apple Silicon arm64) · 윈도우(QIS.exe)
#   PR · main 변경: 두 OS에서 빌드되고 실행 점검(--selftest)을 통과하는지만 확인
#   태그(v1.2.0 등) · 릴리스 발행 · 수동 실행(버전 입력): QIS-mac.zip · QIS-windows.zip 을 릴리스 자산으로 올림
name: desktop
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "릴리스로 낼 버전 (예: v1.1.0) — 비우면 빌드만"
        required: false
        default: ""
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15          # Apple Silicon (arm64) · macos-14 는 2026-11-02 퇴역
            name: mac
          - os: windows-latest
            name: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    permissions:
      contents: write        # 릴리스로 낼 때 빌드한 파일을 릴리스에 바로 올림
    env:
      # 윈도우 설치 프로그램(QIS-Setup.exe)은 코드 서명 인증서가 있을 때만 만든다.
      # 서명 없는 설치 프로그램은 백신(V3 등)이 평판 기반으로 막아 zip 보다 불리함 — 인증서 시크릿을 넣으면 자동으로 다시 나옴.
      HAS_WIN_CERT: ${{ secrets.WINDOWS_CERT_PFX_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 설치
        run: python -m pip install -r requirements-desktop.txt pytest httpx
      - name: 데스크톱 시험
        run: python -m pytest -q tests/test_desktop.py
      - name: 버전 · 빌드 날짜 넣기 (릴리스 태그 → qis/__init__.py)
        shell: python
        env:
          TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
        run: |
          import os, re, pathlib
          tag = os.environ.get("TAG", "").strip()
          f = pathlib.Path("qis/__init__.py")
          s = f.read_text(encoding="utf-8")
          if tag:
              v = tag.lstrip("vV")
              if not re.fullmatch(r"\d+(\.\d+){1,3}([.-][0-9A-Za-z.]+)?", v):
                  raise SystemExit(f"bad version tag: {tag}")
              s = re.sub(r'__version__\s*=\s*"[^"]*"', f'__version__ = "{v}"', s)
              f.write_text(s, encoding="utf-8")
          import datetime
          today = datetime.date.today().isoformat()
          s = re.sub(r'__build__\s*=\s*"[^"]*"', f'__build__ = "{today}"', s)
          f.write_text(s, encoding="utf-8")
          print(re.search(r'__version__\s*=\s*"([^"]*)"', s).group(0), "(tag:", tag or "none", ") build", today)   # 윈도우 콘솔(cp1252)이라 영문으로
      - name: 빌드
        run: pyinstaller --noconfirm --clean packaging/QIS.spec
      - name: 실행 점검 · 압축 (맥)
        if: runner.os == 'macOS'
        run: |
          file dist/QIS.app/Contents/MacOS/QIS
          codesign --verify --verbose dist/QIS.app || true
          dist/QIS.app/Contents/MacOS/QIS --selftest selftest.json || { cat selftest.json; exit 1; }
          cat selftest.json
          ditto -c -k --sequesterRsrc --keepParent dist/QIS.app QIS-mac.zip
      - name: 코드 서명 · 공증 (맥 — 시크릿 있을 때만)
        if: runner.os == 'macOS' && env.HAS_CERT == 'true'
        env:
          HAS_CERT: ${{ secrets.APPLE_CERT_P12_BASE64 != '' && 'true' || 'false' }}
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          # 1) 임시 키체인에 Developer ID 인증서 넣기
          echo "$APPLE_CERT_P12_BASE64" | base64 --decode > cert.p12
          security create-keychain -p tmp build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p tmp build.keychain
          security import cert.p12 -k build.keychain -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k tmp build.keychain
          IDENT=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.*)"/\1/')
          # 2) 안쪽 바이너리부터 서명 → 앱 전체 → 검증
          find dist/QIS.app/Contents -type f \( -name "*.so" -o -name "*.dylib" -o -perm -u+x \) -print0 | xargs -0 -n1 codesign --force --options runtime --timestamp --entitlements packaging/entitlements.plist --sign "$IDENT" || true
          codesign --force --deep --options runtime --timestamp --entitlements packaging/entitlements.plist --sign "$IDENT" dist/QIS.app
          codesign --verify --deep --strict --verbose=2 dist/QIS.app
          # 3) 공증 → 스테이플 → 다시 압축
          ditto -c -k --sequesterRsrc --keepParent dist/QIS.app notarize.zip
          xcrun notarytool submit notarize.zip --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple dist/QIS.app
          rm -f QIS-mac.zip && ditto -c -k --sequesterRsrc --keepParent dist/QIS.app QIS-mac.zip
          security delete-keychain build.keychain; rm -f cert.p12
      - name: 실행 점검 · 압축 (윈도우)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\QIS\QIS.exe" -ArgumentList "--selftest", "$PWD\selftest.json" -Wait -PassThru
          Get-Content selftest.json -Encoding utf8
          if ($p.ExitCode -ne 0) { throw "selftest 실패 (exit $($p.ExitCode))" }
          Compress-Archive -Path "dist\QIS" -DestinationPath "QIS-windows.zip"
      - name: 코드 서명 준비 (윈도우 — 시크릿 있을 때만)
        if: runner.os == 'Windows' && env.HAS_CERT == 'true'
        shell: pwsh
        env:
          HAS_CERT: ${{ secrets.WINDOWS_CERT_PFX_BASE64 != '' && 'true' || 'false' }}
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          [IO.File]::WriteAllBytes("$PWD\cert.pfx", [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
          $st = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          & $st.FullName sign /f "$PWD\cert.pfx" /p "$env:WINDOWS_CERT_PASSWORD" /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 "dist\QIS\QIS.exe"
          # Inno 가 설치 프로그램 · 제거 프로그램에 쓸 서명 명령
          echo "QIS_SIGNTOOL=$($st.FullName) sign /f $PWD\cert.pfx /p $env:WINDOWS_CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `$f" >> $env:GITHUB_ENV
          Compress-Archive -Force -Path "dist\QIS" -DestinationPath "QIS-windows.zip"
      - name: 설치 프로그램 만들기 (윈도우 · Inno Setup — 서명 인증서 있을 때만)
        if: runner.os == 'Windows' && env.HAS_WIN_CERT == 'true'
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" }
          $langs = Split-Path $iscc | Join-Path -ChildPath "Languages"
          if (-not (Test-Path "$langs\Korean.isl")) { Invoke-WebRequest "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/Korean.isl" -OutFile "$langs\Korean.isl" }
          $ver = (Select-String -Path qis\__init__.py -Pattern '__version__\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          python -c "from PIL import Image; Image.open('qis/web/icons/icon-512.png').save('QIS.ico', sizes=[(256,256),(64,64),(48,48),(32,32),(16,16)])"
          $args = @("/DAppVersion=$ver", "/DSrcDir=$PWD\dist\QIS", "/DOutDir=$PWD", "/DIconFile=$PWD\QIS.ico", "packaging\QIS.iss")
          if ($env:QIS_SIGNTOOL) { $args = @("/DSign", "/Sqissign=$env:QIS_SIGNTOOL") + $args }
          & $iscc @args
          if ($LASTEXITCODE -ne 0) { throw "ISCC 실패" }
          Copy-Item "QIS-Setup-$ver.exe" "QIS-Setup.exe"
          Get-Item QIS-Setup.exe | Format-List Name, Length
      - name: 설치 프로그램 시험 (윈도우 · 조용히 설치 → 실행 점검 → 제거)
        if: runner.os == 'Windows' && env.HAS_WIN_CERT == 'true'
        shell: pwsh
        run: |
          $dir = "$env:LOCALAPPDATA\Programs\QIS"
          function RunWait($exe, $argList, $what) {   # $args 는 PowerShell 예약 변수라 쓰면 안 됨   # 창이 떠서 멈추면 5분 뒤 실패 처리 (영원히 기다리지 않게)
            $p = Start-Process -FilePath $exe -ArgumentList $argList -PassThru
            if (-not $p.WaitForExit(120000)) {
              Write-Host "== 떠 있는 창 =="; Get-Process | Where-Object { $_.MainWindowTitle } | ForEach-Object { Write-Host "$($_.ProcessName): $($_.MainWindowTitle)" }
              if (Test-Path "$PWD\setup.log") { Write-Host "== setup.log 끝부분 =="; Get-Content "$PWD\setup.log" -Tail 40 }
              Get-Process -Name "QIS-Setup*","*.tmp","QIS" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
              $p.Kill(); throw "$what 이(가) 2분 안에 끝나지 않음 — 조용한 모드에서 창이 뜬 것으로 보임" }
            return $p.ExitCode
          }
          $code = RunWait ".\QIS-Setup.exe" @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/LOG=$PWD\setup.log") "설치"
          if ($code -ne 0) { Get-Content setup.log -Tail 30; throw "설치 실패 (exit $code)" }
          if (-not (Test-Path "$dir\QIS.exe")) { throw "설치 위치에 QIS.exe 가 없음: $dir" }
          $p = Start-Process -FilePath "$dir\QIS.exe" -ArgumentList "--selftest", "$PWD\installed.json" -Wait -PassThru
          Get-Content installed.json -Encoding utf8
          if ($p.ExitCode -ne 0) { throw "설치본 selftest 실패 (exit $($p.ExitCode))" }
          $un = Get-ChildItem "$dir\unins*.exe" | Select-Object -First 1
          $code = RunWait $un.FullName @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART") "제거"
          if ($code -ne 0) { throw "제거 실패 (exit $code)" }
          Start-Sleep 3
          if (Test-Path "$dir\QIS.exe") { throw "제거 뒤에도 QIS.exe 가 남음" }
      - name: 인터넷에서 받은 zip 처럼 시험 (윈도우)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # 받은 zip 을 푼 상태 재현: QIS.exe 를 뺀 모든 파일에 (QIS.exe 는 사람이 SmartScreen '실행'으로 넘기는 부분 · CI에선 창이 떠서 멈춤) '인터넷에서 받은 파일' 표시(Zone.Identifier, ZoneId=3)
          Copy-Item -Recurse dist\QIS motw\QIS
          Get-ChildItem motw\QIS -Recurse -File | Where-Object { $_.Name -ne "QIS.exe" } | ForEach-Object { Set-Content -Path $_.FullName -Stream Zone.Identifier -Value "[ZoneTransfer]`r`nZoneId=3" }
          # 1) 보정 없이: 회사 PC에서 본 오류가 재현되는지 (정보용)
          $env:QIS_NO_UNBLOCK = "1"
          $p = Start-Process -FilePath "motw\QIS\QIS.exe" -ArgumentList "--selftest", "$PWD\motw_off.json" -Wait -PassThru
          Get-Content motw_off.json -Encoding utf8
          Write-Host "보정 없이 exit $($p.ExitCode) (1 이면 재현됨)"
          Remove-Item Env:QIS_NO_UNBLOCK
          # 2) 보정 켜고: 반드시 통과 + 표시가 지워졌는지
          $p = Start-Process -FilePath "motw\QIS\QIS.exe" -ArgumentList "--selftest", "$PWD\motw_on.json" -Wait -PassThru
          Get-Content motw_on.json -Encoding utf8
          if ($p.ExitCode -ne 0) { throw "차단 표시가 있는 상태에서 selftest 실패 (exit $($p.ExitCode))" }
          $left = Get-ChildItem motw\QIS -Recurse -Filter *.dll | Where-Object { Get-Item $_.FullName -Stream Zone.Identifier -ErrorAction SilentlyContinue }
          if ($left) { throw "차단 표시가 남은 DLL: $($left.Count)개" }
      # 릴리스 파일은 빌드한 러너에서 바로 릴리스에 올린다. (예전에는 Actions 보관물(artifact)로 넘겼는데,
      # 계정의 보관물 저장 한도가 차면 릴리스가 통째로 실패했음 — 2026-11-13 · 11-15)
      - name: 릴리스에 올리기
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          # 맥 · 윈도우 작업이 동시에 만들 수 있으므로, 만들기에 실패하면 이미 있는지 다시 확인
          if ! gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "QIS $TAG" --notes \
              "QIS 데스크톱 프로그램 $TAG — 윈도우: QIS-windows.zip(압축을 풀고 QIS.exe 실행) · 맥(Apple Silicon): QIS-mac.zip. 설치 방법: docs/데스크톱_프로그램.md" \
              || { sleep 5; gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null; }
          fi
          FILES="QIS-${{ matrix.name }}.zip"
          [ -f QIS-Setup.exe ] && FILES="$FILES QIS-Setup.exe"      # 서명 인증서가 있을 때만 생김
          gh release upload "$TAG" $FILES --clobber -R "$GITHUB_REPOSITORY"

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # if: 에서는 secrets 를 직접 쓸 수 없어(워크플로 문법 오류) env 로 옮겨 판정
      HAS_RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN != '' }}
    steps:
      - name: 체크섬 만들기 (SHA256SUMS.txt)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          mkdir -p out
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -D out -p 'QIS-*.zip' -p 'QIS-Setup.exe'
          ls -la out
          for f in QIS-mac.zip QIS-windows.zip; do [ -f "out/$f" ] || { echo "missing $f"; exit 1; }; done
          (cd out && sha256sum QIS-*.zip $( [ -f QIS-Setup.exe ] && echo QIS-Setup.exe ) > SHA256SUMS.txt && cat SHA256SUMS.txt)
          gh release upload "$TAG" out/SHA256SUMS.txt --clobber -R "$GITHUB_REPOSITORY"
      # ---- 공개 배포 저장소(qis-releases)에도 올림: 고객 · 프로그램의 업데이트 확인(latest.json)이 여기를 봄.
      #      RELEASES_TOKEN(공개 저장소 contents:write 권한의 PAT) 시크릿이 있을 때만. 없으면 이 단계는 건너뜀.
      - name: 공개 배포 저장소에 올리기 (qis-releases)
        if: env.HAS_RELEASES_TOKEN == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
          PUB: ${{ github.repository_owner }}/qis-releases
          NOTES_TXT: ${{ github.event.release.body }}
        run: |
          VER="${TAG#v}"; TODAY="$(date -u +%F)"
          python3 - <<EOF
          import json, os
          pub, tag = os.environ["PUB"], os.environ["TAG"]
          base = f"https://github.com/{pub}/releases/download/{tag}"
          json.dump({"version": "$VER", "build": "$TODAY", "page": f"https://github.com/{pub}/releases/tag/{tag}",
                     "notes": os.environ.get("NOTES_TXT", ""),
                     "assets": {"windows": base + ("/QIS-Setup.exe" if os.path.exists("out/QIS-Setup.exe") else "/QIS-windows.zip"),
                                "windows_zip": base + "/QIS-windows.zip",
                                "mac": base + "/QIS-mac.zip", "mac_zip": base + "/QIS-mac.zip"}},
                    open("out/latest.json", "w", encoding="utf-8"), ensure_ascii=False, indent=1)
          EOF
          if ! gh release view "$TAG" -R "$PUB" >/dev/null 2>&1; then
            gh release create "$TAG" -R "$PUB" --title "QIS $TAG" --notes "QIS 데스크톱 프로그램 $TAG — 윈도우: QIS-windows.zip · 맥(Apple Silicon): QIS-mac.zip"
          fi
          FILES="out/QIS-mac.zip out/QIS-windows.zip out/SHA256SUMS.txt out/latest.json"
          [ -f out/QIS-Setup.exe ] && FILES="$FILES out/QIS-Setup.exe"
          gh release upload "$TAG" $FILES --clobber -R "$PUB"
          # 최신 릴리스로 표시해야 /releases/latest/download/latest.json 이 이 버전을 가리킴
          gh release edit "$TAG" -R "$PUB" --latest
